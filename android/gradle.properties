# The JVM for Gradle and the Android Gradle plugin.
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
# The app uses no Jetpack libraries (SDLActivity is a plain android.app.Activity).
android.useAndroidX=false
# Only arm64-v8a is built; nothing to split.
android.enableJetifier=false
org.gradle.parallel=true
org.gradle.caching=false
